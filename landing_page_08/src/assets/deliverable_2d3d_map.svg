<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#0f172a" rx="12"/>
  <!-- Map Outline -->
  <polygon points="60,60 440,40 420,240 80,260" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <!-- Heatmap contours -->
  <ellipse cx="220" cy="140" rx="110" ry="70" fill="#ef4444" fill-opacity="0.5"/>
  <ellipse cx="220" cy="140" rx="60" ry="35" fill="#dc2626" fill-opacity="0.7"/>
  <ellipse cx="330" cy="180" rx="70" ry="40" fill="#f59e0b" fill-opacity="0.5"/>
  <!-- Grid HUD -->
  <line x1="60" y1="150" x2="430" y2="140" stroke="#38bdf8" stroke-opacity="0.3"/>
  <line x1="240" y1="50" x2="250" y2="250" stroke="#38bdf8" stroke-opacity="0.3"/>
  <!-- Format Badges -->
  <rect x="20" y="270" width="80" height="30" rx="6" fill="#0284c7"/><text x="60" y="290" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GeoTIFF</text>
  <rect x="110" y="270" width="70" height="30" rx="6" fill="#0369a1"/><text x="145" y="290" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">KMZ</text>
  <rect x="190" y="270" width="70" height="30" rx="6" fill="#075985"/><text x="225" y="290" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SHP</text>
  <text x="480" y="290" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">Bản Đồ Phân Bố Bụi 2D/3D</text>
</svg>