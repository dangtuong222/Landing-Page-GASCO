<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#090d16" rx="12"/>
  <!-- Axes -->
  <line x1="70" y1="40" x2="70" y2="240" stroke="#475569" stroke-width="2"/>
  <line x1="70" y1="240" x2="450" y2="240" stroke="#475569" stroke-width="2"/>
  <!-- Axis labels -->
  <text x="30" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">500m</text>
  <text x="30" y="140" fill="#94a3b8" font-family="sans-serif" font-size="10">250m</text>
  <text x="40" y="240" fill="#94a3b8" font-family="sans-serif" font-size="10">0m</text>
  <text x="440" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">µg/m³</text>
  <!-- Data Curve -->
  <path d="M 70 240 Q 180 220 220 180 T 380 120 T 190 60" fill="none" stroke="#10b981" stroke-width="4"/>
  <!-- Step points -->
  <circle cx="70" cy="240" r="5" fill="#34d399"/>
  <circle cx="150" cy="215" r="5" fill="#34d399"/>
  <circle cx="220" cy="180" r="5" fill="#34d399"/>
  <circle cx="310" cy="140" r="5" fill="#f59e0b"/>
  <circle cx="380" cy="120" r="5" fill="#ef4444"/>
  <circle cx="190" cy="60" r="5" fill="#34d399"/>
  <!-- Format Badges -->
  <rect x="20" y="270" width="70" height="30" rx="6" fill="#059669"/><text x="55" y="290" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CSV</text>
  <rect x="100" y="270" width="80" height="30" rx="6" fill="#047857"/><text x="140" y="290" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Biểu Đồ</text>
  <text x="480" y="290" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">Hồ Sơ Cột Dọc Cao Độ</text>
</svg>