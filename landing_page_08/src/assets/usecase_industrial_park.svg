<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
    <linearGradient id="plume" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad4)" rx="12"/>

  <!-- Factories Silhouette -->
  <polygon points="80,320 80,220 120,220 120,180 150,250 190,200 230,320" fill="#312e81"/>
  <rect x="250" y="200" width="110" height="120" fill="#312e81"/>
  <!-- Chimneys -->
  <rect x="100" y="150" width="14" height="70" fill="#4338ca"/>
  <rect x="280" y="130" width="16" height="70" fill="#4338ca"/>

  <!-- Smoke Plume Dispersion -->
  <path d="M 107 150 C 130 110, 200 90, 320 100 C 420 110, 480 80, 550 60" fill="none" stroke="url(#plume)" stroke-width="40" stroke-linecap="round"/>

  <!-- Flight Path Downstream -->
  <path d="M 320 220 L 320 60 L 450 60 L 450 220" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Measurements Callout -->
  <rect x="360" y="130" width="190" height="60" rx="6" fill="#1e1b4b" fill-opacity="0.9" stroke="#8b5cf6"/>
  <text x="372" y="152" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Đo Hạ Lưu Khí Bổ Trợ:</text>
  <text x="372" y="172" fill="#e0e7ff" font-family="sans-serif" font-size="11">NO2: 45 ppb | SO2, CO (Chỉ dẫn)</text>

  <!-- Card Overlay -->
  <rect x="20" y="320" width="560" height="60" rx="8" fill="#1e1b4b" fill-opacity="0.95" stroke="#6366f1"/>
  <text x="35" y="345" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Quan Trắc Tác Động Khu Công Nghiệp &amp; Hành Lang Giao Thông</text>
  <text x="35" y="365" fill="#c7d2fe" font-family="sans-serif" font-size="12">Đo đạc vùng hạ lưu gió | Kết hợp Bụi mịn PM2.5/PM10 &amp; Khí phụ trợ NO2/SO2/CO/O3</text>
</svg>