<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="helixGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
    <linearGradient id="layerHigh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b2b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff416c" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="layerMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7b731" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fa8231" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="layerLow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2bcbba" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0fb9b1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="100" y1="100" x2="700" y2="100"/>
    <line x1="100" y1="180" x2="700" y2="180"/>
    <line x1="100" y1="260" x2="700" y2="260"/>
    <line x1="100" y1="340" x2="700" y2="340"/>
    <line x1="100" y1="420" x2="700" y2="420"/>
    <line x1="100" y1="500" x2="700" y2="500"/>
  </g>

  <!-- Altitude Axis -->
  <g fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">
    <text x="50" y="105">500m</text>
    <text x="50" y="185">400m</text>
    <text x="50" y="265">300m</text>
    <text x="50" y="345">200m</text>
    <text x="50" y="425">100m</text>
    <text x="50" y="505">0m</text>
  </g>

  <!-- Altitude Layers -->
  <polygon points="120,160 680,160 720,200 80,200" fill="url(#layerHigh)"/>
  <polygon points="120,320 680,320 720,360 80,360" fill="url(#layerMid)"/>
  <polygon points="120,440 680,440 720,480 80,480" fill="url(#layerLow)"/>

  <!-- Layer labels -->
  <text x="690" y="175" fill="#ff4b2b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Tầng Bụi Tích Tụ (Hotspot)</text>
  <text x="690" y="335" fill="#f7b731" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Tầng Phân Tầng Khí Khẩu</text>
  <text x="690" y="455" fill="#2bcbba" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Tầng Mặt Đất</text>

  <!-- Helix Flight Path -->
  <path d="M 400 500 C 550 480, 550 440, 400 440 C 250 440, 250 400, 400 400 C 550 400, 550 360, 400 360 C 250 360, 250 320, 400 320 C 550 320, 550 280, 400 280 C 250 280, 250 240, 400 240 C 550 240, 550 200, 400 200 C 250 200, 250 160, 400 160 C 550 160, 550 120, 400 120" 
        fill="none" stroke="url(#helixGrad)" stroke-width="4" stroke-dasharray="8 4" filter="url(#glow)"/>

  <!-- Drone Indicator at Top -->
  <circle cx="400" cy="120" r="12" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="400" cy="120" r="6" fill="#ffffff"/>
  <text x="425" y="115" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">UAV Payload OPC-N3 (1Hz Sampling)</text>
  <text x="425" y="132" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Tốc độ leo: 1m/s | Cảm biến hông | Khử downwash >10s</text>

  <!-- PM2.5 Data Curve Overlay -->
  <path d="M 160 500 Q 220 440 280 420 T 360 340 T 210 260 T 480 180 T 310 100" fill="none" stroke="#ff0844" stroke-width="3" stroke-linecap="round"/>

  <!-- Chart Legend -->
  <rect x="100" y="30" width="600" height="45" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155"/>
  <text x="120" y="58" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Mô hình phân tầng nồng độ Bụi Mịn 3D (Vertical Profile S0298)</text>
  <circle cx="530" cy="53" r="5" fill="#ff0844"/>
  <text x="542" y="57" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Nồng độ PM2.5 (µg/m³)</text>
  <circle cx="640" cy="53" r="5" fill="#00f2fe"/>
  <text x="652" y="57" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Quỹ đạo bay leo</text>
</svg>