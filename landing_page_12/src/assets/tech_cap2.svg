<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#0b172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="plumeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.5)"/>
      <stop offset="60%" stop-color="rgba(167, 139, 250, 0.3)"/>
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  
  <rect x="50" y="50" width="1100" height="700" rx="16" fill="rgba(15,23,42,0.9)" stroke="#00f2fe" stroke-width="2"/>
  <text x="80" y="110" fill="#00f2fe" font-family="Space Grotesk" font-size="28" font-weight="bold">CAPABILITY 02: SYNCHRONIZED MULTI-SENSOR TELEMETRY FUSION</text>
  <text x="80" y="145" fill="#94a3b8" font-family="Inter" font-size="16">Đồng bộ CH₄–gió–vị trí–thời gian giữa cảm biến quang học, anemometer 3D và GNSS/RTK/INS</text>

  <!-- Telemetry 3 Nodes -->
  <g transform="translate(120, 220)">
    <rect width="280" height="340" rx="12" fill="#020817" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="140" cy="100" r="45" fill="rgba(0,242,254,0.15)" stroke="#00f2fe" stroke-width="2"/>
    <text x="140" y="108" fill="#00f2fe" font-family="Space Grotesk" font-size="20" text-anchor="middle" font-weight="bold">CH₄ Sensor</text>
    <text x="140" y="190" fill="#ffffff" font-family="Space Grotesk" font-size="16" text-anchor="middle">Open-Path Laser</text>
    <text x="140" y="220" fill="#94a3b8" font-family="Inter" font-size="14" text-anchor="middle">Path-Integrated</text>
    <text x="140" y="250" fill="#00f2fe" font-family="Space Grotesk" font-size="16" text-anchor="middle" font-weight="bold">ppm-m / s</text>
  </g>

  <g transform="translate(460, 220)">
    <rect width="280" height="340" rx="12" fill="#020817" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="140" cy="100" r="45" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="2"/>
    <text x="140" y="108" fill="#a78bfa" font-family="Space Grotesk" font-size="20" text-anchor="middle" font-weight="bold">3D Anemometer</text>
    <text x="140" y="190" fill="#ffffff" font-family="Space Grotesk" font-size="16" text-anchor="middle">Ultrasonic Wind</text>
    <text x="140" y="220" fill="#94a3b8" font-family="Inter" font-size="14" text-anchor="middle">Vectors U, V, W</text>
    <text x="140" y="250" fill="#a78bfa" font-family="Space Grotesk" font-size="16" text-anchor="middle" font-weight="bold">m/s &amp; Deg</text>
  </g>

  <g transform="translate(800, 220)">
    <rect width="280" height="340" rx="12" fill="#020817" stroke="#10b981" stroke-width="2"/>
    <circle cx="140" cy="100" r="45" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="108" fill="#10b981" font-family="Space Grotesk" font-size="20" text-anchor="middle" font-weight="bold">RTK / GNSS / INS</text>
    <text x="140" y="190" fill="#ffffff" font-family="Space Grotesk" font-size="16" text-anchor="middle">Position &amp; Time</text>
    <text x="140" y="220" fill="#94a3b8" font-family="Inter" font-size="14" text-anchor="middle">&lt; 5cm Positioning</text>
    <text x="140" y="250" fill="#10b981" font-family="Space Grotesk" font-size="16" text-anchor="middle" font-weight="bold">UTC Sync (10Hz)</text>
  </g>

  <!-- Status Box -->
  <rect x="80" y="650" width="1040" height="60" rx="8" fill="#020817" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="110" y="687" fill="#a78bfa" font-family="Space Grotesk" font-size="15" font-weight="bold">TRẠNG THÁI: Đồng Bộ Dữ Liệu Thời Gian Thực | Đảm bảo tính nhất quán dữ liệu không gian–thời gian</text>

</svg>