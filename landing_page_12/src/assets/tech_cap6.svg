<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Ma trận truy xuất dữ liệu MRV</title><desc id="desc">Luồng dữ liệu có mã định danh nối dữ liệu thực địa, bản đồ GIS và báo cáo kiểm toán.</desc>
<defs><linearGradient id="b" x2="0" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0b172a"/></linearGradient><linearGradient id="c"><stop stop-color="#00f2fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect width="1200" height="800" rx="36" fill="url(#b)"/><g fill="none" stroke="#24415c" stroke-width="2"><path d="M90 130h1020M90 670h1020"/><path d="M160 180v440M1040 180v440" stroke-dasharray="8 12"/></g>
<text x="600" y="100" fill="#e2f4ff" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">CHUỖI TRUY XUẤT DỮ LIỆU MRV</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="115" y="260" width="260" height="230" rx="22" fill="#10253a" stroke="#00f2fe" stroke-width="3"/><text x="245" y="330" fill="#00f2fe" font-size="24" font-weight="700">01 · THỰC ĐỊA</text><text x="245" y="385" fill="#dbeafe" font-size="20">LiDAR · GNSS · Ô mẫu</text><text x="245" y="430" fill="#94a3b8" font-size="17">Nhật ký bay &amp; QA/QC</text>
<rect x="470" y="260" width="260" height="230" rx="22" fill="#10253a" stroke="#38bdf8" stroke-width="3"/><text x="600" y="330" fill="#38bdf8" font-size="24" font-weight="700">02 · PHÂN TÍCH</text><text x="600" y="385" fill="#dbeafe" font-size="20">Bản đồ GIS · Mô hình</text><text x="600" y="430" fill="#94a3b8" font-size="17">Phiên bản &amp; nguồn dữ liệu</text>
<rect x="825" y="260" width="260" height="230" rx="22" fill="#10253a" stroke="#a78bfa" stroke-width="3"/><text x="955" y="330" fill="#c4b5fd" font-size="24" font-weight="700">03 · BÀN GIAO</text><text x="955" y="385" fill="#dbeafe" font-size="20">Báo cáo MRV · Tệp GIS</text><text x="955" y="430" fill="#94a3b8" font-size="17">Mã hồ sơ &amp; kiểm toán</text></g>
<g fill="none" stroke="url(#c)" stroke-width="6" stroke-linecap="round"><path d="M385 375h66"/><path d="M740 375h66"/></g><g fill="#a78bfa"><path d="m445 363 20 12-20 12z"/><path d="m800 363 20 12-20 12z"/></g><rect x="350" y="555" width="500" height="58" rx="29" fill="#0c2033" stroke="#31506b"/><text x="600" y="592" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Mỗi đầu ra giữ liên kết tới nguồn và phiên bản xử lý</text></svg>
