<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#0b172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="plumeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.5)"/>
      <stop offset="60%" stop-color="rgba(167, 139, 250, 0.3)"/>
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  
  <rect x="50" y="50" width="1100" height="700" rx="16" fill="rgba(15,23,42,0.9)" stroke="#00f2fe" stroke-width="2"/>
  <text x="80" y="110" fill="#00f2fe" font-family="Space Grotesk" font-size="28" font-weight="bold">CAPABILITY 05: QA/QC QUALITY FLAGS &amp; UNCERTAINTY BUDGET</text>
  <text x="80" y="145" fill="#94a3b8" font-family="Inter" font-size="16">Theo dõi và định lượng ảnh hưởng từ cảm biến, nồng độ nền, khí tượng, độ bao phủ không gian &amp; dữ liệu loại trừ</text>

  <!-- QA/QC Quality Flag Cards -->
  <g transform="translate(120, 200)">
    <rect width="280" height="180" rx="8" fill="#020817" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="40" fill="#10b981" font-family="Space Grotesk" font-size="18" font-weight="bold">FLAG 0: VALID DATA</text>
    <text x="20" y="80" fill="#ffffff" font-family="Inter" font-size="14">Dữ liệu hợp lệ 100%</text>
    <text x="20" y="110" fill="#94a3b8" font-family="Inter" font-size="13">Đạt tiêu chí khí tượng &amp; RTK</text>
  </g>

  <g transform="translate(460, 200)">
    <rect width="280" height="180" rx="8" fill="#020817" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="40" fill="#f59e0b" font-family="Space Grotesk" font-size="18" font-weight="bold">FLAG 1: LOW WIND</text>
    <text x="20" y="80" fill="#ffffff" font-family="Inter" font-size="14">Vận tốc gió &lt; 1.5 m/s</text>
    <text x="20" y="110" fill="#94a3b8" font-family="Inter" font-size="13">Cảnh báo khuếch tán yếu</text>
  </g>

  <g transform="translate(800, 200)">
    <rect width="280" height="180" rx="8" fill="#020817" stroke="#ef4444" stroke-width="2"/>
    <text x="20" y="40" fill="#ef4444" font-family="Space Grotesk" font-size="18" font-weight="bold">FLAG 2: OUT-OF-BOUND</text>
    <text x="20" y="80" fill="#ffffff" font-family="Inter" font-size="14">Ngoài ranh giới đo đạc</text>
    <text x="20" y="110" fill="#94a3b8" font-family="Inter" font-size="13">Đưa vào Nhật ký Loại trừ D1</text>
  </g>

  <!-- Uncertainty Budget Matrix -->
  <rect x="120" y="420" width="960" height="190" rx="8" fill="#020817" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="460" fill="#a78bfa" font-family="Space Grotesk" font-size="18" font-weight="bold">Ngân Sách Độ Không Đảm Bảo (Uncertainty Budget Breakdown):</text>
  <text x="150" y="500" fill="#ffffff" font-family="Inter" font-size="14">• Cảm biến quang học &amp; nồng độ nền Upwind: ± 4.5%</text>
  <text x="150" y="530" fill="#ffffff" font-family="Inter" font-size="14">• Biến động vận tốc/hướng gió &amp; mô hình lớp biên: ± 11.2%</text>
  <text x="150" y="560" fill="#ffffff" font-family="Inter" font-size="14">• Độ bao phủ cao độ không gian &amp; nội suy plume: ± 8.0%</text>

  <!-- Status Box -->
  <rect x="80" y="650" width="1040" height="60" rx="8" fill="#020817" stroke="#10b981" stroke-width="1.5"/>
  <text x="110" y="687" fill="#10b981" font-family="Space Grotesk" font-size="15" font-weight="bold">TRẠNG THÁI: Kiểm Soát Chất Lượng QA/QC | Đảm bảo tính minh bạch cho Báo cáo MRV D6</text>

</svg>