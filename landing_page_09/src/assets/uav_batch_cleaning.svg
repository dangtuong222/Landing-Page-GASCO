<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="batchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#batchBg)"/>
  
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="500" height="280" rx="12" fill="#0B1120" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    
    <!-- Fleet of Drones Spraying -->
    <g transform="translate(120, 80)">
      <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <polygon points="0,10 -30,80 30,80" fill="rgba(6,182,212,0.3)"/>
      <text x="0" y="-22" fill="#06B6D4" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">UAV ALPHA</text>
    </g>

    <g transform="translate(380, 80)">
      <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <polygon points="0,10 -30,80 30,80" fill="rgba(6,182,212,0.3)"/>
      <text x="0" y="-22" fill="#06B6D4" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">UAV BETA</text>
    </g>

    <!-- Solar array underneath -->
    <rect x="40" y="190" width="420" height="50" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="250" y="220" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">UC2: BATCH ELECTROSTATIC CLEANING OPERATION</text>
  </g>
</svg>
