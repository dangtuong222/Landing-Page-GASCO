<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#bgGrad2)"/>

  <!-- Radar scan grid circles -->
  <g transform="translate(300, 175)" stroke="rgba(6, 182, 212, 0.2)" fill="none">
    <circle r="50" stroke-width="1"/>
    <circle r="100" stroke-width="1"/>
    <circle r="140" stroke-dasharray="4,4" stroke-width="1"/>
    <line x1="-160" y1="0" x2="160" y2="0"/>
    <line x1="0" y1="-160" x2="0" y2="160"/>
  </g>

  <!-- RTK Baseline Drone & Sensor Beam -->
  <g transform="translate(300, 100)">
    <!-- Drone Body -->
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#06B6D4"/>
    
    <!-- Rotors & Arms -->
    <line x1="-50" y1="-20" x2="50" y2="20" stroke="#06B6D4" stroke-width="2"/>
    <line x1="-50" y1="20" x2="50" y2="-20" stroke="#06B6D4" stroke-width="2"/>
    <ellipse cx="-50" cy="-20" rx="15" ry="4" fill="rgba(6,182,212,0.4)"/>
    <ellipse cx="50" cy="20" rx="15" ry="4" fill="rgba(6,182,212,0.4)"/>
    <ellipse cx="-50" cy="20" rx="15" ry="4" fill="rgba(6,182,212,0.4)"/>
    <ellipse cx="50" cy="-20" rx="15" ry="4" fill="rgba(6,182,212,0.4)"/>

    <!-- Sensor Scan Rays Downward -->
    <polygon points="0,10 -120,160 120,160" fill="url(#cyanGrad2)" opacity="0.25"/>
    <line x1="0" y1="10" x2="-120" y2="160" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="10" x2="120" y2="160" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="10" x2="0" y2="160" stroke="#06B6D4" stroke-width="2" opacity="0.8" filter="url(#glow2)"/>
  </g>

  <!-- Ground PV Panel Array Baseline Measured -->
  <g transform="translate(180, 260)">
    <polygon points="0,0 240,0 200,40 -40,40" fill="#0B1120" stroke="#06B6D4" stroke-width="1.5"/>
    <!-- Soiling Grid Mesh -->
    <line x1="60" y1="0" x2="20" y2="40" stroke="rgba(255,255,255,0.2)"/>
    <line x1="120" y1="0" x2="80" y2="40" stroke="rgba(255,255,255,0.2)"/>
    <line x1="180" y1="0" x2="140" y2="40" stroke="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Baseline Metric Badges -->
  <g transform="translate(420, 40)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#1E293B" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <text x="15" y="25" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">BASELINE SOILING</text>
    <text x="15" y="52" fill="#F59E0B" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800">86.4% SR</text>
  </g>

  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#1E293B" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <text x="15" y="25" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">STANDARDS</text>
    <text x="15" y="52" fill="#06B6D4" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">IEC 61724-1</text>
  </g>
</svg>
