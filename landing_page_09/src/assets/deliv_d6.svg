<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="d6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#d6Grad)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="210" rx="8" fill="#0B1120" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="340" height="40" rx="8" fill="#1E293B"/>
    <text x="20" y="25" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700">DELIVERABLE D6 • MULTI-CYCLE TREND ANALYTICS</text>

    <!-- Multi cycle trend graph -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="290" height="125" rx="6" fill="#1E293B"/>
      <!-- Grid -->
      <line x1="20" y1="25" x2="270" y2="25" stroke="rgba(255,255,255,0.08)"/>
      <line x1="20" y1="65" x2="270" y2="65" stroke="rgba(255,255,255,0.08)"/>
      <line x1="20" y1="105" x2="270" y2="105" stroke="rgba(255,255,255,0.08)"/>

      <!-- Multi peak curve -->
      <path d="M 20 90 L 60 25 L 110 95 L 150 20 L 200 85 L 250 18" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
      <circle cx="60" cy="25" r="4" fill="#10B981"/>
      <circle cx="150" cy="20" r="4" fill="#10B981"/>
      <circle cx="250" cy="18" r="4" fill="#10B981"/>
    </g>
