<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="emgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#emgBg)"/>

  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="500" height="280" rx="12" fill="#0B1120" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    
    <!-- Warning Beacon & Emergency Alert -->
    <g transform="translate(250, 60)">
      <polygon points="0,-25 -25,20 25,20" fill="#F59E0B"/>
      <text x="0" y="12" fill="#0B1120" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="900" text-anchor="middle">!</text>
    </g>

    <text x="250" y="120" fill="#F59E0B" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">SỰ KIỆN BỤI BÃO MÙA / KHẨN CẤP</text>
    <text x="250" y="150" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Triển khai UAV can thiệp khắc phục sự cố soiling đột biến trong 24h</text>

    <rect x="120" y="190" width="260" height="45" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="250" y="217" fill="#F59E0B" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">UC3: EMERGENCY DUST RESPONSE</text>
  </g>
</svg>
