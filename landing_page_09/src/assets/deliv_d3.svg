      <line x1="20" y1="20" x2="140" y2="20" stroke="rgba(255,255,255,0.1)"/>
      <line x1="20" y1="60" x2="140" y2="60" stroke="rgba(255,255,255,0.1)"/>
      <line x1="20" y1="100" x2="140" y2="100" stroke="rgba(255,255,255,0.1)"/>
      
