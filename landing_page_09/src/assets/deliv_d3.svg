      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#d3Grad)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="210" rx="8" fill="#0B1120" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    
