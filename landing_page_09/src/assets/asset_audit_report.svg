    <rect x="0" y="0" width="400" height="50" rx="12" fill="#1E293B"/>
    <text x="200" y="31" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" text-anchor="middle">UC5: INDEPENDENT ASSET AUDIT REPORT</text>

