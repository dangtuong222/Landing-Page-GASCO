<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#gridBg)"/>
  
  <g transform="translate(50, 40)">
    <!-- 3D Perspective Grid -->
    <polygon points="50,220 450,220 400,60 100,60" fill="#0B1120" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <path d="M 120 60 L 90 220 M 180 60 L 170 220 M 240 60 L 250 220 M 300 60 L 330 220 M 360 60 L 410 220" stroke="rgba(6, 182, 212, 0.2)"/>
    
    <!-- RTK Flight Grid Line Path -->
    <path d="M 100 190 L 380 190 L 360 150 L 120 150 L 140 110 L 340 110 L 320 80 L 160 80" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- UAV Drone Icon at Endpoint -->
    <circle cx="160" cy="80" r="14" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <circle cx="160" cy="80" r="4" fill="#10B981"/>
    
    <!-- Title Card -->
    <rect x="120" y="240" width="260" height="45" rx="8" fill="#1E293B" stroke="rgba(16, 185, 129, 0.4)"/>
    <text x="250" y="267" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">UC1: GNSS RTK FLIGHT GRID SURVEY</text>
  </g>
</svg>
