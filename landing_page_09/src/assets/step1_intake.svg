<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.15" stroke="#06B6D4" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/>
    <line x1="550" y1="0" x2="550" y2="350"/>
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
  </g>

  <!-- GIS Boundary Polygon & Solar Arrays Map -->
  <g transform="translate(60, 40)">
    <!-- Map Base Frame -->
    <rect x="0" y="0" width="480" height="270" rx="12" fill="#0B1120" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <!-- Solar Array Grid Blocks -->
    <g opacity="0.6">
      <rect x="30" y="30" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
      <rect x="120" y="30" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
      <rect x="210" y="30" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
      
      <rect x="30" y="80" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
      <rect x="120" y="80" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
      <rect x="210" y="80" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>

      <rect x="30" y="130" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
      <rect x="120" y="130" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
      <rect x="210" y="130" width="80" height="40" rx="4" fill="#06B6D4" opacity="0.3" stroke="#06B6D4"/>
    </g>

    <!-- Survey Boundary Highlight -->
    <path d="M 20 20 L 310 20 L 310 180 L 20 180 Z" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glow1)"/>
    
    <!-- Boundary Pins & Coordinates -->
    <circle cx="20" cy="20" r="5" fill="#10B981"/>
    <circle cx="310" cy="20" r="5" fill="#10B981"/>
    <circle cx="310" cy="180" r="5" fill="#10B981"/>
    <circle cx="20" cy="180" r="5" fill="#10B981"/>

    <!-- Right Side Intake Info Card Panel -->
    <rect x="315" y="25" width="145" height="220" rx="8" fill="#1E293B" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    
    <!-- Document Header Badge -->
    <rect x="330" y="40" width="115" height="24" rx="12" fill="url(#cyanGrad1)"/>
    <text x="387" y="56" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INTAKE DATASET</text>
    
    <!-- Info List items -->
    <g font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">
      <text x="330" y="90" fill="#38BDF8" font-weight="600">✓ Ranh giới GIS (.KML)</text>
      <text x="330" y="115" fill="#38BDF8" font-weight="600">✓ Model Module Pin</text>
      <text x="330" y="140" fill="#38BDF8" font-weight="600">✓ Chỉ dẫn OEM Manual</text>
      <text x="330" y="165" fill="#38BDF8" font-weight="600">✓ Lịch sử Soiling Site</text>
    </g>

    <rect x="330" y="190" width="115" height="35" rx="6" fill="#0B1120" stroke="#10B981" stroke-width="1"/>
    <text x="387" y="211" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATUS: SCOPED</text>
  </g>
</svg>
