      <text x="0" y="65" fill="#FFFFFF" font-weight="600">Điểm hòa vốn O&amp;M (ROI):</text>
      <text x="0" y="85" fill="#10B981">• Ngưỡng SR = 91.5%</text>
      <text x="0" y="110" fill="#38BDF8">• Đề xuất đợt làm sạch 2</text>
