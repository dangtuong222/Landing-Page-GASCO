<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="d5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#d5Grad)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="210" rx="8" fill="#0B1120" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="340" height="40" rx="8" fill="#1E293B"/>
    <text x="20" y="25" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700">DELIVERABLE D5 • O&amp;M CYCLE RECOMMENDATION</text>

    <!-- Calendar & Schedule Visual -->
    <g transform="translate(25, 60)" font-family="Inter, sans-serif" font-size="10">
      <rect x="0" y="0" width="130" height="125" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#06B6D4"/>
      <text x="65" y="20" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" text-anchor="middle">OCTOBER 2026</text>
      
      <text x="65" y="65" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" text-anchor="middle">15 DAYS</text>
      <text x="65" y="90" fill="#94A3B8" font-size="9" text-anchor="middle">Chu kỳ làm sạch tối ưu</text>
    </g>

    <g transform="translate(170, 60)" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">
