<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="chargeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#techBg)"/>

  <!-- Nozzle Mechanism Graphics -->
  <g transform="translate(100, 80)">
    <!-- Nozzle Metal Body -->
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <polygon points="120,10 170,20 170,40 120,50" fill="#0B1120" stroke="#06B6D4" stroke-width="2"/>
    
    <!-- Electrostatic Charging Ring -->
    <circle cx="170" cy="30" r="22" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="170" cy="30" r="30" fill="url(#chargeGlow)"/>
    <text x="170" y="34" fill="#F59E0B" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="900" text-anchor="middle">+</text>
    
    <!-- Spraying charged droplets cone -->
    <polygon points="175,30 420,-30 420,90" fill="rgba(6, 182, 212, 0.25)"/>
    
    <!-- Positively Charged Droplets -->
    <g fill="#06B6D4">
      <circle cx="220" cy="20" r="4"/>
      <circle cx="280" cy="10" r="5"/>
      <circle cx="340" cy="40" r="4"/>
      <circle cx="300" cy="-10" r="3"/>
      <circle cx="380" cy="30" r="5"/>
      <circle cx="250" cy="45" r="3"/>
    </g>
  </g>

  <!-- Ground PV Panel Target Surface -->
  <g transform="translate(180, 290)">
    <rect x="0" y="0" width="340" height="45" rx="6" fill="#0B1120" stroke="#10B981" stroke-width="2"/>
    <text x="170" y="27" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">BỀ MẶT KÍNH PIN PV (TỰ ĐỘNG HÚT CÁC HẠT TÍCH ĐIỆN)</text>
  </g>
</svg>
