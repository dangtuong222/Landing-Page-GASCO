<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#bgGrad6)"/>

  <!-- Stacked Deliverable Reports Package D1-D7 -->
  <g transform="translate(140, 50)">
    <!-- Back Folder Shadow -->
    <rect x="20" y="20" width="300" height="230" rx="12" fill="#0B1120" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="10" y="10" width="300" height="230" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <!-- Front Master Deliverables Folder -->
    <rect x="0" y="0" width="300" height="230" rx="12" fill="#0B1120" stroke="#10B981" stroke-width="2"/>
    
    <!-- Header Ribbon -->
    <rect x="0" y="0" width="300" height="45" rx="12" fill="url(#emeraldGrad)"/>
    <text x="150" y="28" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" text-anchor="middle">DELIVERABLES HANDOVER D1 – D7</text>

    <!-- Deliverable items breakdown list inside folder -->
    <g transform="translate(25, 65)" font-family="Inter, sans-serif" font-size="11" fill="#F8FAFC">
      <text x="0" y="15" fill="#38BDF8" font-weight="700">D1: Kế hoạch bay &amp; Hồ sơ phép bay</text>
      <text x="0" y="35" fill="#38BDF8" font-weight="700">D2: Nhật ký UAV &amp; Telemetry Payload</text>
      <text x="0" y="55" fill="#10B981" font-weight="700">D3: Dữ liệu Baseline &amp; Soiling Ratio (SR)</text>
      <text x="0" y="75" fill="#10B981" font-weight="700">D4: Báo cáo QA/QC &amp; Bất định (Uncertainty)</text>
      <text x="0" y="95" fill="#F59E0B" font-weight="700">D5: Đề xuất Chu kỳ Vệ sinh O&amp;M</text>
      <text x="0" y="115" fill="#F59E0B" font-weight="700">D6: Báo cáo Phân tích Xu hướng Nhiều Kỳ</text>
      <text x="0" y="135" fill="#E2E8F0" font-weight="700">D7: Khuyến nghị Hành động Hiện trường</text>
    </g>

    <!-- Certified Seal Badge -->
    <g transform="translate(240, 180)">
      <circle r="28" fill="#10B981"/>
      <circle r="23" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2"/>
      <path d="M -8 0 L -2 6 L 10 -6" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- Side QC Rating Badge -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="100" height="150" rx="10" fill="#1E293B" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <text x="50" y="35" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" text-anchor="middle">QA/QC</text>
    <text x="50" y="60" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PASSED</text>
    <line x1="20" y1="75" x2="80" y2="75" stroke="rgba(255,255,255,0.1)"/>
    <text x="50" y="95" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Traceable</text>
    <text x="50" y="115" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">IEC 61724-1</text>
  </g>
</svg>
