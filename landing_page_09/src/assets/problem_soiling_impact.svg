<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="probBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#probBg)"/>

  <!-- Sun Rays Source -->
  <g transform="translate(300, 40)">
    <circle r="25" fill="url(#sunGrad)"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" text-anchor="middle">SUNLIGHT</text>
    
    <!-- Rays -->
    <line x1="-80" y1="40" x2="-180" y2="160" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="80" y1="40" x2="180" y2="160" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Left Side: Atmospheric Aerosol PM2.5 Mechanism -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="230" height="200" rx="12" fill="#0B1120" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="35" rx="12" fill="#1E293B"/>
    <text x="115" y="22" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. AEROSOL KHÍ QUYỂN (PM2.5)</text>
    
    <!-- Floating Aerosol Particles Scattering Light -->
    <circle cx="50" cy="70" r="8" fill="#38BDF8" opacity="0.5"/>
    <circle cx="120" cy="90" r="12" fill="#38BDF8" opacity="0.4"/>
    <circle cx="180" cy="65" r="6" fill="#38BDF8" opacity="0.6"/>
    
    <text x="115" y="140" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Làm tán xạ bức xạ tới</text>
    <text x="115" y="160" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Ghi nhận: Dữ liệu Bức xạ Kẹp</text>
  </g>

  <!-- Right Side: Surface Soiling Dust Layer Mechanism -->
  <g transform="translate(330, 160)">
    <rect x="0" y="0" width="230" height="200" rx="12" fill="#0B1120" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="35" rx="12" fill="#1E293B"/>
    <text x="115" y="22" fill="#F59E0B" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. BỤI SOILING BÁM BỀ MẶT</text>
    
    <!-- PV Glass with Dust Layer -->
    <rect x="25" y="60" width="180" height="30" rx="4" fill="#1E293B" stroke="#06B6D4"/>
    <rect x="25" y="60" width="180" height="8" rx="4" fill="#F59E0B" opacity="0.8"/>
    
    <text x="115" y="140" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Ngăn cản ánh sáng vào tế bào PV</text>
    <text x="115" y="160" fill="#F59E0B" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Đo bằng: Soiling Ratio (SR)</text>
  </g>
</svg>
