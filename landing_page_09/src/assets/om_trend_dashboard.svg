<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#dashBg)"/>

  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="500" height="280" rx="12" fill="#0B1120" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    
    <!-- Dashboard Header -->
    <rect x="0" y="0" width="500" height="40" rx="12" fill="#1E293B"/>
    <text x="250" y="25" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">UC4: O&amp;M LONG-TERM TREND ANALYTICS DASHBOARD</text>

    <!-- Graph Mockup -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="420" height="150" rx="8" fill="#1E293B"/>
      <!-- Grid -->
      <line x1="20" y1="30" x2="400" y2="30" stroke="rgba(255,255,255,0.08)"/>
      <line x1="20" y1="75" x2="400" y2="75" stroke="rgba(255,255,255,0.08)"/>
      <line x1="20" y1="120" x2="400" y2="120" stroke="rgba(255,255,255,0.08)"/>

      <!-- Smooth Multi-Month SR Trend Line -->
      <path d="M 30 110 Q 90 130 150 40 T 270 120 T 390 35" fill="none" stroke="#10B981" stroke-width="3"/>
    </g>

    <text x="250" y="245" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CHU KỲ VỆ SINH TỐI ƯU KINH TẾ (IEC TS 61724-3)</text>
  </g>
</svg>
