<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="d1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#d1Grad)"/>
  
  <!-- Document Container -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="210" rx="8" fill="#0B1120" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    
    <!-- Doc Title Header -->
    <rect x="0" y="0" width="340" height="40" rx="8" fill="#1E293B"/>
    <text x="20" y="25" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700">DELIVERABLE D1 • FLIGHT PERMIT &amp; MISSION PLAN</text>
    
    <!-- Blueprint Lines -->
    <g transform="translate(20, 60)" opacity="0.7">
      <rect x="0" y="0" width="140" height="80" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="70" cy="40" r="25" fill="none" stroke="#06B6D4" stroke-width="1"/>
      <path d="M 0 0 L 140 80 M 0 80 L 140 0" stroke="#06B6D4" stroke-width="0.5"/>
      <text x="70" y="105" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">GNSS Flight Grid Boundary</text>
    </g>

    <g transform="translate(180, 60)" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">
      <text x="0" y="15" fill="#FFFFFF" font-weight="600">Quy định áp dụng:</text>
      <text x="0" y="32" fill="#10B981">• NĐ 288/2025/NĐ-CP</text>
      <text x="0" y="48" fill="#10B981">• Luật 49/2024/QH15</text>
      <text x="0" y="64" fill="#38BDF8">• Toạ độ VN-2000 Ranh giới</text>
      <text x="0" y="80" fill="#38BDF8">• Kế hoạch bay khẩn cấp</text>
    </g>

    <!-- Stamp -->
    <g transform="translate(290, 160)">
      <circle r="22" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="0" y="3" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" text-anchor="middle">OFFICIAL</text>
    </g>
  </g>
</svg>
