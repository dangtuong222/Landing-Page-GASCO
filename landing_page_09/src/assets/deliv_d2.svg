<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="d2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#d2Grad)"/>
  
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="210" rx="8" fill="#0B1120" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="340" height="40" rx="8" fill="#1E293B"/>
    <text x="20" y="25" fill="#06B6D4" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700">DELIVERABLE D2 • UAV TELEMETRY &amp; FLIGHT LOG</text>
    
    <!-- Table Mockup -->
    <g transform="translate(20, 55)" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">
      <!-- Header row -->
      <rect x="0" y="0" width="300" height="20" fill="#1E293B" rx="3"/>
      <text x="10" y="14" fill="#FFFFFF" font-weight="700">TIME</text>
      <text x="80" y="14" fill="#FFFFFF" font-weight="700">ALT (m)</text>
      <text x="140" y="14" fill="#FFFFFF" font-weight="700">SPRAY RATE</text>
      <text x="230" y="14" fill="#FFFFFF" font-weight="700">GNSS STATUS</text>

      <!-- Row 1 -->
      <text x="10" y="36">08:15:02</text>
      <text x="80" y="36">3.5 m</text>
      <text x="140" y="36" fill="#06B6D4">1.8 L/min</text>
      <text x="230" y="36" fill="#10B981">RTK FIX (1cm)</text>
      
      <!-- Row 2 -->
      <text x="10" y="54">08:20:45</text>
      <text x="80" y="54">3.5 m</text>
      <text x="140" y="54" fill="#06B6D4">1.8 L/min</text>
      <text x="230" y="54" fill="#10B981">RTK FIX (1cm)</text>

      <!-- Row 3 -->
      <text x="10" y="72">08:35:10</text>
      <text x="80" y="72">3.5 m</text>
      <text x="140" y="72" fill="#06B6D4">1.8 L/min</text>
      <text x="230" y="72" fill="#10B981">RTK FIX (1cm)</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="20" y="145" width="300" height="45" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
    <text x="35" y="165" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Tổng thời gian bay: <tspan fill="#FFFFFF" font-weight="700">42 min</tspan></text>
    <text x="35" y="180" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Dung dịch tiêu thụ: <tspan fill="#06B6D4" font-weight="700">75.6 Liters</tspan></text>
  </g>
</svg>
