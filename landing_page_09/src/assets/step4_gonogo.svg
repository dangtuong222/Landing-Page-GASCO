<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#bgGrad4)"/>

  <!-- Main GO/NO-GO Checklist Board -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="480" height="270" rx="12" fill="#0B1120" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="480" height="45" rx="12" fill="#1E293B"/>
    <text x="240" y="28" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" text-anchor="middle">12 TIÊU CHÍ AN TOÀN GO / NO-GO &amp; THỬ NGHIỆM VÙNG</text>

    <!-- Checklist 2 Columns Grid -->
    <g transform="translate(30, 65)" font-family="Inter, sans-serif" font-size="11" fill="#F8FAFC">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 9 L 8 13 L 14 5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="14">Tốc độ gió (&lt;8 m/s)</text>

        <rect x="0" y="32" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 41 L 8 45 L 14 37" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="46">Tầm nhìn xa (&gt;3 km)</text>

        <rect x="0" y="64" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 73 L 8 77 L 14 69" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="78">Chênh nhiệt (&#8804;20°C)</text>

        <rect x="0" y="96" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 105 L 8 109 L 14 101" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="110">Pin/Payload UAV Đạt 100%</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 9 L 8 13 L 14 5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="14">GNSS RTK Lock Fix</text>

        <rect x="0" y="32" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 41 L 8 45 L 14 37" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="46">Áp lực phun (&#8804;4.0 MPa)</text>

        <rect x="0" y="64" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 73 L 8 77 L 14 69" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="78">Nước pH 6.0 - 8.0</text>

        <rect x="0" y="96" width="18" height="18" rx="4" fill="#10B981"/>
        <path d="M 4 105 L 8 109 L 14 101" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="28" y="110">Khoảng cách an toàn đạt</text>
      </g>
    </g>

    <!-- Bottom Verdict Banner -->
    <rect x="30" y="205" width="420" height="45" rx="8" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
    <text x="240" y="233" fill="#10B981" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" text-anchor="middle">VERDICT: GO FOR SPRAYING OPERATION</text>
  </g>
</svg>
